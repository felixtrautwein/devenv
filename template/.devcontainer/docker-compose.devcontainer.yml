# Managed by https://github.com/felixtrautwein/devenv - run `devenv sync` to update.
#
# Values come from .devcontainer/.env, which is generated by initializeCommand.sh.
services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVENV_IMAGE: ${DEVENV_IMAGE:-ghcr.io/felixtrautwein/devenv:web}
    image: ${COMPOSE_PROJECT_NAME:-devcontainer}-local
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    group_add:
      - ${DOCKER_SOCK_GID}
    tty: true
    environment:
      WORKSPACE_FOLDER: ${WORKSPACE_FOLDER}
      HOST_UID: ${HOST_UID}
      HOST_GID: ${HOST_GID}
      DOCKER_SOCK_GID: ${DOCKER_SOCK_GID}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GHCR_USER: ${GHCR_USER:-}
      LC_ALL: C.UTF-8
    working_dir: ${WORKSPACE_FOLDER}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:${WORKSPACE_FOLDER}:cached
      - cache:/home/dev/.cache
      - ${HOME}/.netrc:/home/dev/.netrc:ro
      - ${HOME}/.ssh/:/home/dev/.ssh:ro
      - /dev/:/dev/
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cache:
    name: devenv-cache-${USER}
