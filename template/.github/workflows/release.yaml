name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment/k8s/deployment.yaml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      IMAGE: ghcr.io/${{ github.repository }}
      HETZNER_S3_NAME: ${{ vars.HETZNER_S3_NAME }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}

    steps:
      # The commit step below needs the persisted credentials to push, and this
      # job uploads no artifacts.
      - name: Checkout repo # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        env:
          HETZNER_S3_ACCESS_KEY: ${{ vars.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config="bucket=${HETZNER_S3_NAME}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="access_key=${HETZNER_S3_ACCESS_KEY}" \
            -backend-config="secret_key=${HETZNER_S3_SECRET_KEY}"

      - name: Resolve ingress IPv4
        env:
          K8S_LOAD_BALANCER_HOST: ${{ vars.K8S_LOAD_BALANCER_HOST }}
        run: |
          set -euo pipefail
          ip="$(getent ahostsv4 "${K8S_LOAD_BALANCER_HOST}" | awk '{print $1}' | head -n1)"
          if [[ -z "${ip}" ]]; then
            echo "Could not resolve IPv4 for ${K8S_LOAD_BALANCER_HOST}" >&2
            exit 1
          fi
          echo "K8S_INGRESS_IPV4=${ip}" >> "$GITHUB_ENV"

      - name: Terraform Apply DNS
        env:
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
        run: |
          terraform apply \
            -auto-approve \
            -var "hetzner_api_key=${HETZNER_API_KEY}" \
            -var "domain_name=${DOMAIN_NAME}" \
            -var "k8s_ingress_ipv4=${K8S_INGRESS_IPV4}"

      - name: Update deployment image digest
        env:
          DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::Build step did not expose an image digest."
            exit 1
          fi

          sed -i -E "s|(^[[:space:]]*image:[[:space:]]+).*|\\1${IMAGE}@${DIGEST}|" deployment/k8s/deployment.yaml

      - name: Verify SealedSecret manifests exist
        run: |
          set -euo pipefail
          if [[ ! -f deployment/k8s/app-env.sealedsecret.yaml || ! -f deployment/k8s/ghcr-secret.sealedsecret.yaml ]]; then
            echo "::error::SealedSecret manifests are missing in deployment/k8s/. Generate and commit them before release."
            exit 1
          fi

      - name: Commit deployment image update
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          if git diff --quiet -- deployment/k8s/deployment.yaml; then
            echo "No deployment manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment/k8s/deployment.yaml
          git commit -m "chore: update deployment image digest for ${GITHUB_SHA}"
          git push

# --- repository specific release additions below ---
