name: Refresh Sealed Secrets

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to base the PR on
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      PULL_SECRET_NAME: ghcr-secret
      APP_ENV_KEYS: ${{ vars.APP_ENV_KEYS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Install kubeseal
        run: |
          set -euo pipefail
          KUBESEAL_VERSION="0.29.0"
          curl -fsSL -o kubeseal.tar.gz "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 0755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Write Sealed Secrets public cert
        env:
          SEALED_SECRETS_CERT: ${{ vars.SEALED_SECRETS_CERT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("SEALED_SECRETS_CERT", "")
          text = raw.strip()

          # Accept either real multiline PEM or a single line with literal
          # "\\n" escapes from repo variables.
          if "\\n" in text and "\n" not in text:
            text = text.replace("\\n", "\n")

          if "BEGIN CERTIFICATE" not in text or "END CERTIFICATE" not in text:
            raise SystemExit(
              "Set repository variable SEALED_SECRETS_CERT to a valid PEM certificate"
            )

          Path("sealed-secrets.pem").write_text(text + "\n", encoding="utf-8")
          PY
          openssl x509 -in sealed-secrets.pem -noout >/dev/null
          chmod 600 sealed-secrets.pem

      - name: Render SealedSecret manifests
        env:
          SEALED_SECRETS_CERT: ${{ github.workspace }}/sealed-secrets.pem
          APP_ENV_SECRETS_JSON: ${{ toJSON(secrets) }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/render-sealed-secrets.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "chore(secrets): refresh sealed secrets"
          title: "chore(secrets): refresh sealed secrets"
          body: |
            Automated refresh of SealedSecret manifests from GitHub Secrets/Variables.

            Trigger: `${{ github.workflow }}` (`${{ github.run_id }}`)
          base: ${{ inputs.branch }}
          branch: chore/refresh-sealed-secrets
          delete-branch: true
          add-paths: |
            deployment/k8s/*.sealedsecret.yaml
