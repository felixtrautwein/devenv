# Managed by https://github.com/felixtrautwein/devenv - run `devenv sync` to update.
# Add repository specific hooks under the `local` repo below.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        # .vscode and .devcontainer files are JSONC: comments and trailing commas.
        exclude: '(^|/)\.(vscode|devcontainer)/.*\.json$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.po$|\.pot$'
      - id: trailing-whitespace
        exclude: '\.po$|\.pot$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: dependencies
        name: Sync python dependencies
        language: system
        entry: uv sync --all-packages
        pass_filenames: false
      - id: test
        name: Execute tests
        language: system
        entry: uv run pytest
        pass_filenames: false
# --- repository specific hooks below ---
