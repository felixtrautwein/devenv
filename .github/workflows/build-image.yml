name: Build devenv images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "image/**"
  schedule:
    # Weekly rebuild to pick up upstream security updates.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [python, web, embedded]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read variant build args
        id: args
        run: |
          {
            echo 'value<<EOF'
            grep -v '^#' "image/variants/${{ matrix.variant }}.env" | grep -v '^$'
            echo EOF
          } >>"${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ghcr.io/felixtrautwein/devenv:${{ matrix.variant }}
            ${{ matrix.variant == 'web' && 'ghcr.io/felixtrautwein/devenv:latest' || '' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: false
